<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5EBE6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EADBC8;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#8D7B68" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Background shape -->
  <rect x="20" y="20" width="460" height="360" rx="24" fill="url(#grad1)" />
  
  <!-- Laptop Body -->
  <rect x="80" y="80" width="340" height="200" rx="12" fill="#FAF0E6" stroke="#DAC0A3" stroke-width="3" filter="url(#shadow)"/>
  <rect x="95" y="95" width="310" height="170" rx="6" fill="#4A3E3D"/>
  
  <!-- Code lines on screen -->
  <text x="115" y="125" fill="#EED9C4" font-family="monospace" font-size="14" font-weight="bold">numbers = [10, 20, 30, 40]</text>
  <text x="115" y="150" fill="#DAC0A3" font-family="monospace" font-size="14">numbers.append(50)</text>
  <text x="115" y="175" fill="#C8AE7D" font-family="monospace" font-size="14">print(len(numbers)) # Output: 5</text>
  <text x="115" y="205" fill="#A0C49D" font-family="monospace" font-size="14"># Python lists trainer active ✨</text>

  <!-- Laptop Base -->
  <path d="M 50 280 L 450 280 L 470 310 Q 470 315 465 315 L 35 315 Q 30 315 30 310 Z" fill="#D0B8A6" filter="url(#shadow)"/>
  <rect x="210" y="285" width="80" height="8" rx="4" fill="#8D7B68" opacity="0.4"/>
  
  <!-- Decorative Elements -->
  <circle cx="410" cy="70" r="25" fill="#C8AE7D" opacity="0.4"/>
  <circle cx="70" cy="340" r="18" fill="#F2D8D8" opacity="0.6"/>
  <text x="395" y="75" fill="#765827" font-family="sans-serif" font-size="20" font-weight="bold">[ ]</text>
</svg>